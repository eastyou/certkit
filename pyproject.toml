[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "certkit"
version = "0.1.0"
description = "奖状生成器：CSV 名单一键生成 A4 横向可打印奖状"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["certificate", "award", "education", "print", "csv", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
certkit = "certkit.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/certkit"
Source = "https://github.com/eastyou/certkit"

[tool.setuptools]
packages = ["certkit"]
