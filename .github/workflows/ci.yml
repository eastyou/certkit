name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test certificate generation
        run: |
          python -m certkit -i examples/获奖名单.csv --date 2026-11-21 --issuer 星海中学 -o certificates.html
          python -c "print(open('certificates.html', encoding='utf-8').read().count('section class=' + chr(34) + 'sheet'))"
          python -c "print(open('certificates.html', encoding='utf-8').read().count('奖'))"
          python -c "print(open('certificates.html', encoding='utf-8').read().count('A4 landscape'))"
